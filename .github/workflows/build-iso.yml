name: Build MR.ROBOT OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "os/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux \
            syslinux-common \
            gettext \
            po4a \
            debian-archive-keyring

          git clone --depth 1 \
            https://salsa.debian.org/live-team/live-build.git \
            /tmp/live-build-current

          sudo make -C /tmp/live-build-current install
          hash -r
          lb --version

      - name: Configure and build bootable ISO
        working-directory: os
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x auto/config
          chmod +x config/hooks/live/*.hook.chroot

          sudo lb clean --purge || true
          sudo ./auto/config

          # Locate vesamenu.c32 from the installed Syslinux packages.
          VESAMENU="$(find \
            /usr/lib/syslinux \
            /usr/share/syslinux \
            -type f -name vesamenu.c32 \
            -print -quit 2>/dev/null || true)"

          if [ -z "$VESAMENU" ]; then
            echo "ERROR: vesamenu.c32 was not found."
            echo "Searching installed Syslinux files:"
            dpkg -L syslinux-common syslinux 2>/dev/null || true
            exit 1
          fi

          echo "Found vesamenu module: $VESAMENU"

          # Ensure live-build includes the missing boot menu module.
          sudo mkdir -p config/includes.binary/isolinux
          sudo install -m 0644 "$VESAMENU" \
            config/includes.binary/isolinux/vesamenu.c32

          # Build the ISO.
          sudo lb build

          # Find the resulting hybrid ISO.
          ISO="$(find . -maxdepth 1 -type f \
            -name '*.hybrid.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: No hybrid ISO was produced."
            find . -maxdepth 3 -type f -name '*.iso' -print
            exit 1
          fi

          # Verify the boot menu module exists in the finished ISO.
          xorriso -indev "$ISO" \
            -find /isolinux -name vesamenu.c32 \
            > /tmp/vesamenu-check.txt

          cat /tmp/vesamenu-check.txt

          if ! grep -q 'vesamenu.c32' /tmp/vesamenu-check.txt; then
            echo "ERROR: vesamenu.c32 is missing from the finished ISO."
            exit 1
          fi

          # Export the ISO and checksum.
          sudo install -o "$(id -un)" -g "$(id -gn)" \
            "$ISO" ../MR-ROBOT-OS-amd64.iso

          cd ..

          test -s MR-ROBOT-OS-amd64.iso

          sha256sum MR-ROBOT-OS-amd64.iso \
            > MR-ROBOT-OS-amd64.iso.sha256

          ls -lh MR-ROBOT-OS-amd64.iso*

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR-ROBOT-OS-amd64
          path: |
            MR-ROBOT-OS-amd64.iso
            MR-ROBOT-OS-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14

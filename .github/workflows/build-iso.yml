
name: Build MR.ROBOT OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "os/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            gettext \
            po4a \
            debian-archive-keyring

          git clone --depth 1 \
            https://salsa.debian.org/live-team/live-build.git \
            /tmp/live-build-current

          sudo make -C /tmp/live-build-current install
          hash -r
          lb --version

      - name: Build bootable ISO
        working-directory: os
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x auto/config
          chmod +x config/hooks/live/*.hook.chroot

          sudo lb clean --purge || true
          sudo ./auto/config

          sudo lb build

          ISO="$(find . -maxdepth 1 -type f -name '*.hybrid.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: No hybrid ISO was produced."
            find . -maxdepth 3 -type f -name '*.iso' -print
            exit 1
          fi

          sudo install -o "$USER" -g "$(id -gn)" \
            "$ISO" ../MR-ROBOT-OS-amd64.iso

          cd ..

          test -s MR-ROBOT-OS-amd64.iso

          sha256sum MR-ROBOT-OS-amd64.iso \
            > MR-ROBOT-OS-amd64.iso.sha256

          ls -lh MR-ROBOT-OS-amd64.iso*
          
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR-ROBOT-OS-amd64
          path: |
            MR-ROBOT-OS-amd64.iso
            MR-ROBOT-OS-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14

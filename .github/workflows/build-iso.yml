name: Build MR.ROBOT OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "os/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux \
            syslinux-common \
            gettext \
            po4a \
            debian-archive-keyring

          git clone --depth 1 \
            https://salsa.debian.org/live-team/live-build.git \
            /tmp/live-build-current

          sudo make -C /tmp/live-build-current install
          hash -r
          lb --version

      - name: Configure and build bootable ISO
        working-directory: os
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x auto/config
          chmod +x config/hooks/live/*.hook.chroot

          sudo lb clean --purge || true
          sudo ./auto/config

          # ---- Fix missing Syslinux modules (the real cause of the boot error) ----
          SYSLINUX_BIOS="/usr/lib/syslinux/modules/bios"

          if [ ! -d "$SYSLINUX_BIOS" ]; then
            echo "ERROR: $SYSLINUX_BIOS not found"
            find /usr/lib/syslinux -type d 2>/dev/null || true
            exit 1
          fi

          echo "Copying Syslinux BIOS modules from $SYSLINUX_BIOS"

          sudo mkdir -p config/includes.binary/isolinux

          # Copy every module that isolinux / vesamenu needs
          for mod in \
            vesamenu.c32 \
            libcom32.c32 \
            libutil.c32 \
            ldlinux.c32 \
            libmenu.c32 \
            libgpl.c32 \
            menu.c32 \
            hdt.c32
          do
            if [ -f "$SYSLINUX_BIOS/$mod" ]; then
              sudo install -m 0644 "$SYSLINUX_BIOS/$mod" config/includes.binary/isolinux/
              echo "  + $mod"
            fi
          done

          # Also copy isolinux.bin if available
          if [ -f /usr/lib/ISOLINUX/isolinux.bin ]; then
            sudo install -m 0644 /usr/lib/ISOLINUX/isolinux.bin config/includes.binary/isolinux/
            echo "  + isolinux.bin"
          fi

          # Build the ISO
          sudo lb build

          # Find the resulting hybrid ISO
          ISO="$(find . -maxdepth 1 -type f -name '*.hybrid.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: No hybrid ISO was produced."
            find . -maxdepth 3 -type f -name '*.iso' -print
            exit 1
          fi

          # Quick verification that vesamenu is actually inside the ISO
          xorriso -indev "$ISO" -find /isolinux -name vesamenu.c32 > /tmp/vesamenu-check.txt || true
          cat /tmp/vesamenu-check.txt
          if ! grep -q vesamenu.c32 /tmp/vesamenu-check.txt; then
            echo "WARNING: vesamenu.c32 still not found inside ISO"
          else
            echo "OK: vesamenu.c32 is present in the ISO"
          fi

          # Export the ISO and checksum
          sudo install -o "$(id -un)" -g "$(id -gn)" \
            "$ISO" ../MR-ROBOT-OS-amd64.iso

          cd ..

          test -s MR-ROBOT-OS-amd64.iso

          sha256sum MR-ROBOT-OS-amd64.iso \
            > MR-ROBOT-OS-amd64.iso.sha256

          ls -lh MR-ROBOT-OS-amd64.iso*

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR-ROBOT-OS-amd64
          path: |
            MR-ROBOT-OS-amd64.iso
            MR-ROBOT-OS-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14

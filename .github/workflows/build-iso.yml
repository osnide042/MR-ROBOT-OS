name: Build MR.ROBOT OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["os/**", ".github/workflows/build-iso.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common gettext po4a debian-archive-keyring
          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/live-build-current
          sudo make -C /tmp/live-build-current install
          hash -r
          lb --version
      - name: Build bootable ISO
        working-directory: os
        run: |
          chmod +x auto/config config/hooks/live/*.hook.chroot
          sudo lb clean --purge || true
          sudo ./auto/config
          sudo lb build
          set -- ./*.hybrid.iso
          test -f "$1" || (echo "ISO build finished but no hybrid ISO was found" && exit 1)
          sudo mv "$1" ../MR-ROBOT-OS-amd64.iso
          sudo chown "$USER:$USER" ../MR-ROBOT-OS-amd64.iso
          sha256sum ../MR-ROBOT-OS-amd64.iso > ../MR-ROBOT-OS-amd64.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MR-ROBOT-OS-amd64
          path: |
            MR-ROBOT-OS-amd64.iso
            MR-ROBOT-OS-amd64.iso.sha256
          retention-days: 14


name: Build MR.ROBOT OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "os/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            gettext \
            po4a \
            debian-archive-keyring

          git clone --depth 1 \
            https://salsa.debian.org/live-team/live-build.git \
            /tmp/live-build-current

          sudo make -C /tmp/live-build-current install
          hash -r
          lb --version

      - name: Configure live system
        working-directory: os
        run: |
          set -eux
          chmod +x auto/config
          chmod +x config/hooks/live/*.hook.chroot

          sudo lb clean --purge || true
          sudo ./auto/config

      - name: Build bootable ISO
        working-directory: os
        run: |
          set -eux
          sudo lb build

          ISO="$(find . -maxdepth 1 -type f -name '*.hybrid.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "ERROR: No hybrid ISO was generated."
            find . -maxdepth 2 -type f -name '*.iso' -print
            exit 1
          fi

          echo "Inspecting ISO boot files:"
          xorriso -indev "$ISO" -find / -name 'isolinux.bin' -print
          xorriso -indev "$ISO" -find / -name 'vesamenu.c32' -print
          xorriso -indev "$ISO" -find / -name 'menu.c32' -print

          mkdir -p ../artifacts
          cp "$ISO" ../artifacts/MR-ROBOT-OS-amd64.iso
          sha256sum ../artifacts/MR-ROBOT-OS-amd64.iso \
            > ../artifacts/MR-ROBOT-OS-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR-ROBOT-OS-amd64
          path: |
            os/artifacts/MR-ROBOT-OS-amd64.iso
            os/artifacts/MR-ROBOT-OS-amd64.iso.sha256
          retention-days: 14
